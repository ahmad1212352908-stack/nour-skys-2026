<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nour — Queen of the Stars of the Sky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Reem+Kufi:wght@500&family=Cairo:wght@600&display=swap" rel="stylesheet">
<style>
:root{--night:#07051a;--gold:#f3d58a;--rose:#ff9fc4;--ink:#efe9ff;--glass:rgba(20,14,52,.72);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.head{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:0;right:0;text-align:center;pointer-events:none;opacity:0;transition:opacity 2.4s ease 1.2s}
.ready .head{opacity:1}
.head .ar{font-family:'Reem Kufi','Segoe UI',sans-serif;font-size:clamp(54px,12vw,104px);line-height:1;color:var(--gold);text-shadow:0 0 28px rgba(243,213,138,.55),0 0 80px rgba(255,159,196,.3)}
.head .en{font-style:italic;font-weight:600;font-size:clamp(20px,4.6vw,34px);letter-spacing:.04em;margin-top:6px;color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 14px;opacity:0;transition:opacity 2s ease 2.4s}
.ready .bar{opacity:1}
button,.btn{font:inherit;font-size:19px;font-style:italic;color:var(--ink);background:var(--glass);border:1px solid rgba(243,213,138,.55);border-radius:999px;padding:10px 20px;cursor:pointer;backdrop-filter:blur(8px)}
button:hover,.btn:hover{background:rgba(243,213,138,.18)}
button:focus-visible,.btn:focus-within{outline:2px solid var(--gold);outline-offset:3px}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);text-align:center;font-style:italic;font-size:17px;color:rgba(239,233,255,.7);pointer-events:none;opacity:0;transition:opacity 2s ease 3s}
.ready .hint{opacity:1}
#letter{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,3,20,.6);padding:20px}
#letter.on{display:flex}
#letter .card{max-width:520px;max-height:80%;overflow:auto;background:var(--glass);border:1px solid rgba(243,213,138,.6);border-radius:18px;padding:28px 26px;direction:rtl;text-align:right;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;font-weight:600;font-size:21px;line-height:1.9;box-shadow:0 0 60px rgba(255,159,196,.25);backdrop-filter:blur(10px)}
#letter .card b{color:var(--gold);font-weight:500;display:block;font-size:26px;margin-bottom:8px}
#letter button{margin-top:16px;direction:ltr}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;direction:ltr}
#letter .nav button{margin-top:0;font-size:17px;padding:8px 16px}
#letter #msg{display:block;min-height:8.5em}
#cnt{font-style:italic;font-size:18px;color:var(--gold)}
#letter .card .x{display:block;margin:14px auto 0}
.settled .head,.settled .bar,.settled .hint{transition:opacity .5s ease}
body.focus .head,body.focus .bar,body.focus .hint{opacity:0;pointer-events:none}
#cap{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:min(92vw,560px);box-sizing:border-box;padding:16px 20px;direction:rtl;text-align:center;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;font-weight:600;font-size:clamp(19px,4.8vw,26px);line-height:1.9;color:#fff;background:rgba(10,6,36,.86);border:1px solid rgba(243,213,138,.65);border-radius:16px;backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .5s ease .35s,transform .5s ease .35s}
#cap.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.head,.bar,.hint{transition-duration:.01s;transition-delay:0s}}
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive 3D starry sky with photo frames"></canvas>
<div class="head"><div class="ar">نور</div><div class="en">Queen of the Stars of the Sky</div></div>
<div class="hint">Drag to turn the sky · tap a photo to open it</div>
<div class="bar">
  <button id="open">Open my messages</button>
</div>
<div id="cap" aria-live="polite"></div>
<div id="letter" role="dialog" aria-modal="true"><div class="card"><b>إلى نور، ملكة نجوم السماء</b><span id="msg"></span>
<div class="nav"><button id="prev">Back</button><span id="cnt"></span><button id="next">Next</button></div>
<button class="x" id="close">Close</button></div></div>

function glowTex(c1,c2){const s=128,k=document.createElement('canvas');k.width=k.height=s;const g=k.getContext('2d');
  const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,c1);r.addColorStop(.25,c2);r.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=r;g.fillRect(0,0,s,s);return new THREE.CanvasTexture(k);}

// Starfield
function stars(n,rmin,rmax,size,op){
  const p=new Float32Array(n*3),col=new Float32Array(n*3),palette=[[1,1,1],[.8,.85,1],[1,.85,.9],[1,.93,.7]];
  for(let i=0;i<n;i++){
    const r=rmin+Math.random()*(rmax-rmin),t=Math.random()*6.2832,u=Math.random()*2-1,s=Math.sqrt(1-u*u);
    p.set([r*s*Math.cos(t),r*u,r*s*Math.sin(t)],i*3);
    col.set(palette[(Math.random()*4)|0],i*3);
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  return new THREE.Points(g,new THREE.PointsMaterial({size,map:dotTex,vertexColors:true,transparent:true,opacity:op,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true}));
}

const lt = new THREE.TextureLoader().load(LOGO);
lt.encoding = THREE.sRGBEncoding;
const lg = new THREE.PlaneGeometry(7,9.25);
const logo = new THREE.Group();
const mk = (tint,side)=>new THREE.MeshBasicMaterial({map:lt,transparent:true,depthWrite:false,fog:false,color:tint,side});
const LAY=11,GAP=.06;
for(let i=0;i<LAY;i++){
  const z=(i-(LAY-1)/2)*GAP, edge=(i===0||i===LAY-1);
  const m=new THREE.Mesh(lg,mk(edge?0xffffff:0x9b7a38,edge?THREE.FrontSide:THREE.DoubleSide));
  m.position.z=z;

// Photo ring
const ring = new THREE.Group();scene.add(ring);
const N=6,R=10.8,frames=[];
function placeholder(i){
  const k=document.createElement('canvas');k.width=480;k.height=600;const g=k.getContext('2d');
  const bg=g.createLinearGradient(0,0,480,600);bg.addColorStop(0,'#2a1b5e');bg.addColorStop(1,'#5b2a6e');g.fillStyle=bg;g.fillRect(0,0,480,600);
  for(let j=0;j<60;j++){g.fillStyle='rgba(255,255,255,'+(Math.random()*.7)+')';g.beginPath();g.arc(Math.random()*480,Math.random()*600,Math.random()*1.8,0,6.3);g.fill();}
  g.fillStyle='#ff9fc4';g.font='120px serif';g.textAlign='center';g.fillText('♥',240,320);
  g.fillStyle='#f3d58a';g.font='italic 34px Georgia';g.fillText('our photo '+(i+1),240,400);
  return new THREE.CanvasTexture(k);
}
function photoTex(img){
  const k=document.createElement('canvas');k.width=768;k.height=960;const g=k.getContext('2d');
  const s=Math.max(768/img.width,960/img.height),w=img.width*s,h=img.height*s;
  g.drawImage(img,(768-w)/2,(960-h)/2,w,h);const t=new THREE.CanvasTexture(k);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;
}
for(let i=0;i<N;i++){
  const f=new THREE.Group(),a=i/N*Math.PI*2;
  const border=new THREE.Mesh(new THREE.PlaneGeometry(3.5,4.3),new THREE.MeshBasicMaterial({color:0xf3d58a,side:THREE.DoubleSide}));
  const pic=new THREE.Mesh(new THREE.PlaneGeometry(3.2,4),new THREE.MeshBasicMaterial({map:placeholder(i),side:THREE.DoubleSide}));
  pic.position.z=.02;f.add(border,pic);f.userData={pic,i};
  f.position.set(Math.sin(a)*R,Math.sin(i*1.7)*1.6,Math.cos(a)*R);f.rotation.y=a;
  f.userData.bp=f.position.clone();f.userData.bq=f.quaternion.clone();
  ring.add(f);frames.push(f);
}
function setPhoto(i,src){const im=new Image();im.onload=()=>{const m=frames[i].userData.pic.material;m.map=photoTex(im);m.needsUpdate=true;};im.src=src;}
PHOTOS.slice(0,N).forEach((s,i)=>setPhoto(i,s));

scene.add(shoot);let shootT=-1,nextShoot=4;

// Interaction
let yaw=0,pitch=0,vy=reduce?0:.0016,vp=0,down=false,moved=0,lx=0,ly=0,sel=null;
cv.addEventListener('pointerdown',e=>{down=true;moved=0;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);vy=dx*.004;vp=dy*.002;yaw+=vy;pitch=Math.max(-.5,Math.min(.5,pitch+vp));});
cv.addEventListener('pointerup',e=>{down=false;if(moved<6)pick(e);if(Math.abs(vy)<.0008&&!reduce)vy=.0016;});
const ray=new THREE.Raycaster(),m2=new THREE.Vector2();
function pick(e){
  m2.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(m2,cam);
  if(sel){sel=null;syncSel();return;}
  const hit=ray.intersectObjects(frames,true)[0];
  if(!hit){sel=null;syncSel();return;}
  let o=hit.object;while(o.parent!==ring)o=o.parent;
  sel=(sel===o)?null:o;syncSel();
}
function syncSel(){
  document.body.classList.toggle('focus',!!sel);
  const c=document.getElementById('cap');
  if(sel){c.textContent=CAPTIONS[sel.userData.i]||'';c.classList.add('on');}else c.classList.remove('on');
}
function resize(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.fov=innerWidth<600?70:55;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const letter=document.getElementById('letter');
// ---- Messages ----
const msgEl=document.getElementById('msg'),cntEl=document.getElementById('cnt');
let mi=0;
function showMsg(){msgEl.textContent=MESSAGES[mi];cntEl.textContent=(mi+1)+' / '+MESSAGES.length;
  document.getElementById('prev').disabled=mi===0;document.getElementById('next').disabled=mi===MESSAGES.length-1;
  document.getElementById('prev').style.opacity=mi===0?.4:1;document.getElementById('next').style.opacity=mi===MESSAGES.length-1?.4:1;}
const openL=()=>{mi=0;showMsg();letter.classList.add('on');document.getElementById('next').focus();};
const closeL=()=>letter.classList.remove('on');
document.getElementById('open').onclick=openL;
document.getElementById('close').onclick=closeL;
document.getElementById('prev').onclick=()=>{if(mi>0){mi--;showMsg();}};
document.getElementById('next').onclick=()=>{if(mi<MESSAGES.length-1){mi++;showMsg();}};
addEventListener('keydown',e=>{
  if(!letter.classList.contains('on'))return;
  if(e.key==='Escape')closeL();
  if(e.key==='ArrowRight'&&mi<MESSAGES.length-1){mi++;showMsg();}
  if(e.key==='ArrowLeft'&&mi>0){mi--;showMsg();}
});

// ---- Soft music (always on; synthesized in the browser: pad + music-box) ----
let ac,master,nextT=0,bar=0,started=false;
const CHORDS=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]]; // Am F C G
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(m,t,dur,type,vol,atk){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=hz(m);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+atk);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.1);
}
function schedule(){
  while(nextT<ac.currentTime+1.6){
    const ch=CHORDS[bar%4],B=6;
    ch.forEach(n=>tone(n-12,nextT,B+1,'triangle',.045,1.8));
    tone(ch[0]-24,nextT,B+1,'sine',.09,1.2);
    const pat=[0,1,2,1,2,1,2,1];
    for(let i=0;i<8;i++){
      const n=ch[pat[i]]+12+((i===4&&bar%2)?12:0);
      tone(n,nextT+i*.75,2.4,'sine',.07,.01);
      tone(n+12,nextT+i*.75,1.2,'sine',.015,.01);
    }
    nextT+=B;bar++;
  }
}
function initMusic(){
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=0;
    const conv=ac.createConvolver(),len=ac.sampleRate*3,buf=ac.createBuffer(2,len,ac.sampleRate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
    conv.buffer=buf;const wet=ac.createGain();wet.gain.value=.7;
    master.connect(ac.destination);master.connect(conv);conv.connect(wet);wet.connect(ac.destination);
    nextT=ac.currentTime+.15;schedule();setInterval(schedule,500);
  }catch(e){ac=null;}
}
// Browsers only allow sound after the first tap, so the music begins with it and then never stops.
function wake(){
  if(!ac)return;
  ac.resume().then(()=>{
    if(started)return;started=true;
    master.gain.cancelScheduledValues(ac.currentTime);master.gain.setValueAtTime(0,ac.currentTime);
    master.gain.linearRampToValueAtTime(.8,ac.currentTime+3);
  }).catch(()=>{});
}
initMusic();
['pointerup','touchend','click','keydown'].forEach(ev=>addEventListener(ev,wake,{passive:true}));
document.addEventListener('visibilitychange',()=>{
  if(!ac)return;
  if(document.hidden)ac.suspend();else if(started)ac.resume();
});


const clock=new THREE.Clock(),tmp=new THREE.Vector3(),tq=new THREE.Quaternion(),wq=new THREE.Quaternion();
let intro=reduce?1:0;
setTimeout(()=>document.body.classList.add('ready'),reduce?0:600);
setTimeout(()=>document.body.classList.add('settled'),reduce?100:6000);
(function loop(){
  requestAnimationFrame(loop);
  const t=clock.getElapsedTime(),dt=Math.min(clock.getDelta(),.05);
  if(intro<1){intro=Math.min(1,intro+.006);const e=1-Math.pow(1-intro,3);cam.position.z=70+(camZ-70)*e;}
  if(!down&&!sel){yaw+=vy;vy+=((reduce?0:.0016)-vy)*.02;pitch*=.99;}
  ring.rotation.y=yaw;ring.rotation.x=pitch;
  far.rotation.y=yaw*.15+t*.002;near.rotation.y=yaw*.4;
  const ph=t*.5;logo.rotation.y=ph-.85*Math.sin(ph);logo.position.y=Math.sin(t*.8)*.25;logo.rotation.x=Math.sin(t*.6)*.12;
  ring.getWorldQuaternion(wq);wq.invert();
  frames.forEach(f=>{
    const to=(sel&&f!==sel)?.08:1;
    f.children.forEach(m=>{const mt=m.material;mt.transparent=true;mt.opacity+=(to-mt.opacity)*.15;mt.depthWrite=mt.opacity>.97;m.renderOrder=(f===sel)?20:0;});
    if(f===sel){
      const d=4.2,vh=2*d*Math.tan(cam.fov*Math.PI/360),vw=vh*cam.aspect,ss=Math.min(.6*vh/4.3,.92*vw/3.5);
      tmp.set(0,.14*vh,camZ-d);ring.worldToLocal(tmp);f.position.lerp(tmp,.1);
      tq.copy(wq);f.quaternion.slerp(tq,.1);f.scale.lerp(new THREE.Vector3(ss,ss,ss),.1);
    }else{
      const bp=f.userData.bp.clone();bp.y+=Math.sin(t*.9+f.userData.i)*.18;
      f.position.lerp(bp,.08);f.quaternion.slerp(f.userData.bq,.08);f.scale.lerp(new THREE.Vector3(1,1,1),.1);
    }
  });
  // shooting star
  if(shootT<0&&t>nextShoot){shootT=0;shoot.position.set(-20+Math.random()*40,12+Math.random()*10,-10);}
  if(shootT>=0){shootT+=.02;shoot.position.x+=.7;shoot.position.y-=.25;shoot.material.opacity=Math.sin(Math.min(shootT,1)*Math.PI);
    if(shootT>1){shootT=-1;nextShoot=t+4+Math.random()*4;shoot.material.opacity=0;}}
  cam.position.x=Math.sin(t*.2)*.4;cam.lookAt(0,0,0);
  renderer.render(scene,cam);
})();
</script>
